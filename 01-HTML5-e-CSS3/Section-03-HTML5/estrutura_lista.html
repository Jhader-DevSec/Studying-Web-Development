<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
</head>
<body>
    <h1>listas nao ordenadas</h1>

    <h3>Lista Sem Type</h3>

    <!--abre a lista (nao ordenada)-->
    <ul>
        <!--tag para adicionar itens a lista-->
        <li>Ovo</li>
        <li>Farinha</li>
        <li>Leite</li>
    </ul>

    <h3>Lista com Type</h3>
    <!--O comando type permite definir qual sera o marcador da lista (disc, square ou circle)-->
    <ul type="circle">
        <li>Ovo</li>
        <li>Farinha</li>
        <li>Leite</li>
    </ul>

    <h1>listas ordenadas</h1>

    <h3>Lista Sem Type</h3>

    <!--abre a lista (ordenada)-->
    <ol>
        <!--tag para adicionar itens a lista-->
        <li>Ovo</li>
        <li>Farinha</li>
        <li>Leite</li>
    </ol>

    <h3>Lista com Type</h3>
    <!--O comando type permite definir qual sera o marcador da lista (1, A, a, I, i )-->
    <ol type="A">
        <li>Ovo</li>
        <li>Farinha</li>
        <li>Leite</li>
    </ol>
</body>
</html>
