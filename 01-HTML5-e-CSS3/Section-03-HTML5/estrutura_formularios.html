<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <!--o comando action mostra ao formulario onde os dados coletados ali podem ser enviados-->
    <form action="">
        Login: <br>
        <input type="text" name="login"><br><!--o atributo name permite definir um nome pelo qual podemos acessar as informações do respectivo campo atravez de uma linguagem de programação-->
        
        senha: <br>
        <input type="password" name="senha"><br> <!--o type define o tipo de dado e no caso de senhas impede a visualização da mesma na hora de digitar-->>

        <!--note que este é apenas um codigo de estudos de funções pois o metodo se ultilizado apenas do jeito demonstrado acima nao é seguro logo o metodo com linguagem e etc sera refeito mais a frente em meus estudos-->
    </form>

    <form action="">
        genero: <br>
        <!--o type radio permite ultilizar inputs de escolha unica-->
        <input type="radio" name="genero" value="M"><br> <!--importante ressaltar que o para que somente uma opção seja selecionada o name deve ser o mesmo para ambos-->
        <input type="radio" name="genero" value="F">

        <br><br>

        interesses: <br>
        <!-- checkbox permite fcruar inputs de escolhas diversas-->
        <input type="checkbox" name="interesses" value="futebol">futebol <br>
        <input type="checkbox" name="interesses" value="basquete">basquete <br>
        <input type="checkbox" name="interesses" value="golf">golf

        <br><br>

        estado: <br>
        <!--select nos permite criar um campo de escolha entre diversas unidades (nao recomendando no caso de escolhas muito estenivas)-->
        <select name="estados">
            <option value="mg">MG</option>
            <option value="sp">SP</option>
            <option value="sc">SC</option>
            <option value="pr">PR</option>
        </select>

        <br><br>

        comentario: <br>
        <textarea name="comentario" value="comentario"></textarea><br>

        <input type="submit" value="enviar"> <!--o value permite definir o que sera mostrado no botao de enviar-->
    </form>
</body>
</html>
