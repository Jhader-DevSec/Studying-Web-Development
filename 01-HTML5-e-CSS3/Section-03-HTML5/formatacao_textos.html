<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
</head>
<body>
    <!--negrito-->
    <strong>Deixa o texto em Negrito</strong>

    <!--salta linha (aqui esta sendo usado apenas para melhor separação visual)-->
    <br>

    <!--italico-->
    <em>Deixa o texto em Italíco</em>

    <br>

    <!--sublinhado-->
    <u>Deixa o texto Sublinhado</u>

    <br>

    <!--linha no meio do texto-->
    <strike>Deixa o texto com corte (simboliza errado)</strike>
</body>
</html>
