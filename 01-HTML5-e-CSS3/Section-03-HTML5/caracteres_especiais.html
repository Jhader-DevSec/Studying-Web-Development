<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caracteres</title>
</head>
<body>
    <!--quando queremos adicionar certo tipos de caracteres esles podem acabar sendo interpretado pelo navegador
    de forma indesejada. para isso servem os caracteres especiais que nos permitem adicionar os mesmos de forma a
    nao haver conflitos com a interpretação-->

    <p> <!--note que a nesse caso navegador interpreta como um p -->

    &lt; p &gt; <!--agora a tag é mostrada da forma a ser exibida no navegador-->

    <p>
        para achar tais codigos para a exibição podemos procurar na internet por esses caracteres especiais
    </p>
</body>
</html>
