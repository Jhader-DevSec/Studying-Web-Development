<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
</head>
<body>
    <h1>Exemplo sem linha</h1>
    <!--tabelas sao um bom meio de organizar dados de forma pratica-->

    <!--inicia a tabela-->
    <table>
        <!--abre a linha da tabela-->
        <tr>
            <!--usado para os titolos/header da tabela-->
            <th>Codigo</th>
            <th>Produto</th>
            <th>Preço</th>
        </tr>

        <tr>
            <!--usado no conteudo da tabela-->
            <td>001</td>
            <td>telefone</td>
            <td>R$ 1.000,00</td>
        </tr>

        <tr>    
            <td>002</td>
            <td>Notebook</td>
            <td>R$ 3.500,00</td>
        </tr>
    </table>

    <br>

    <h1>Exemplo com linha</h1>
    <table border="2"> <!--caso queira podemos definir linha nas tabelas com o parametro border--> 
        <tr> 
            <th>Codigo</th>
            <th>Produto</th>
            <th>Preço</th>
        </tr>
            
        <tr>
            <td>001</td>
            <td>telefone</td>
            <td>R$ 1.000,00</td>
        </tr>
        
        <tr>
            <td>002</td>
            <td>Notebook</td>
            <td>R$ 3.500,00</td>
        </tr>
    </table>
</body>
</html>
